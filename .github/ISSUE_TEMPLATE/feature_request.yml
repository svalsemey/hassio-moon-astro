name: Feature request
description: Suggest a new astronomical value, sensor or improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to achieve?
      description: Describe the use case (dashboard, automation…) rather than the implementation.
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Astronomical value or behavior involved
      description: |
        For a new value: its definition, unit, expected precision and a reference source (Jean Meeus, IMCCE, USNO, Skyfield documentation…) to validate it against.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Templates, other integrations or workarounds you tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples, links.
